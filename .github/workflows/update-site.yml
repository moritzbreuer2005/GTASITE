# Runs by itself every hour on GitHub's servers (free for public repos):
# pulls fresh headlines in all languages, rebuilds the site and publishes it.
# One-time setup: in the GitHub repo, Settings > Pages > Source: "GitHub Actions".
name: Update site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image library and fonts (for share images)
        run: |
          pip install --quiet pillow
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null 2>&1 || true
      - name: Fetch headlines
        run: python fetch_news.py
      - name: Save headlines to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update headlines"
            git pull --rebase --quiet origin main && git push --quiet || echo "Push skipped"
          fi
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
